{% extends "base.html" %}

{% block title %}Scan — open-inventory{% endblock %}

{% block content %}
<section>
    <h2>Inventory Scanner</h2>

    <form>
        <fieldset>
            <legend>Scan Mode</legend>
            <div>
                <label>
                    <input type="radio" name="qty_multiplier" value="1" checked>
                    Each (×1)
                </label>
            </div>
            <div>
                <label>
                    <input type="radio" name="qty_multiplier" value="12">
                    Case (×12)
                </label>
            </div>
            <div>
                <label>
                    <input type="radio" name="qty_multiplier" value="6">
                    Cluster (×6)
                </label>
            </div>
            <div>
                <label>
                    <input type="radio" name="qty_multiplier" value="custom">
                    Custom:
                    <input type="number" name="custom_multiplier" id="custom-multiplier" value="1" min="1" style="width: 80px;">
                </label>
            </div>
        </fieldset>

        <fieldset>
            <legend>Direction</legend>
            <div>
                <label>
                    <input type="radio" name="direction" value="IN" checked>
                    Scan In
                </label>
            </div>
            <div>
                <label>
                    <input type="radio" name="direction" value="OUT">
                    Scan Out
                </label>
            </div>
            <div>
                <label>
                    <input type="radio" name="direction" value="ADJUST">
                    Adjust
                </label>
            </div>
        </fieldset>

        <fieldset>
            <legend>Barcode</legend>
            <input
                type="text"
                id="scan-input"
                name="gtin"
                placeholder="Scan a barcode or enter GTIN..."
                autofocus
                required
                style="font-size: 1.2em; padding: 0.8em;"
            >
        </fieldset>

        <input type="hidden" name="location_id" value="1">
    </form>

    <div id="scan-result" style="margin-top: 2em; min-height: 80px;">
        <!-- HTMX partial responses will land here -->
    </div>

    <hr>

    <h3>Last Scans</h3>
    <div id="scan-history" style="border: 1px solid #ddd; padding: 1em; border-radius: 0.5em; max-height: 200px; overflow-y: auto; min-height: 100px;">
    </div>
</section>

<script>
/**
 * Handle barcode scanner input: when user presses Enter (or scanner sends Enter),
 * POST the form data to /scan via HTMX.
 */
document.getElementById('scan-input').addEventListener('keydown', function(evt) {
    if (evt.key === 'Enter') {
        evt.preventDefault();
        submitScan();
    }
});

async function submitScan() {
    const scanInput = document.getElementById('scan-input');
    const gtin = scanInput.value.trim();
    
    if (!gtin) {
        return;  // Ignore empty scans
    }
    
    // Get form values
    const direction = document.querySelector('input[name="direction"]:checked').value;
    const locationId = document.querySelector('input[name="location_id"]').value;
    let qtyMultiplier = 1;
    
    const selectedMode = document.querySelector('input[name="qty_multiplier"]:checked');
    if (selectedMode.value === 'custom') {
        const customValue = parseInt(document.getElementById('custom-multiplier').value) || 1;
        qtyMultiplier = customValue;
    } else {
        qtyMultiplier = parseInt(selectedMode.value) || 1;
    }
    
    const payload = {
        gtin: gtin,
        direction: direction,
        qty_multiplier: qtyMultiplier,
        location_id: parseInt(locationId),
    };
    
    try {
        const response = await fetch('/scan', {
            method: 'POST',
            headers: {
                'Content-Type': 'application/json',
            },
            body: JSON.stringify(payload),
        });
        
        if (response.ok) {
            const html = await response.text();
            document.getElementById('scan-result').innerHTML = html;
        } else {
            const errorText = await response.text();
            let errorMessage = `Error ${response.status}`;
            
            try {
                const errorJson = JSON.parse(errorText);
                errorMessage = errorJson.detail || errorMessage;
            } catch (e) {
                errorMessage = errorText || errorMessage;
            }
            
            document.getElementById('scan-result').innerHTML = `<div style="color: red; padding: 1em; border: 1px solid red; border-radius: 4px; background: #ffe6e6;">${errorMessage}</div>`;
        }
    } catch (error) {
        console.error('Fetch error:', error);
        document.getElementById('scan-result').innerHTML = `<div style="color: red; padding: 1em;">Network error: ${error.message}</div>`;
    }
    
    // Clear input and re-focus so the next scan is immediately ready.
    scanInput.value = '';
    scanInput.focus();
}
</script>
{% endblock %}
