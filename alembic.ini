# Alembic configuration.
#
# The real database URL is injected at runtime by `alembic/env.py` from
# `inv.settings.Settings.db_path` (which resolves via `platformdirs`).
# The placeholder `sqlalchemy.url` below is only used if `env.py` can't
# construct one — keep it pointed at a scratch file, never the real DB.

[alembic]
# path to migration scripts, relative to this file
script_location = alembic

# template used to generate migration files
# file_template = %%(rev)s_%%(slug)s

# timezone for migration file timestamps
# timezone =

# max length of characters to apply to the "slug" field
# truncate_slug_length = 40

# set to 'true' to run the environment during the 'revision' command, regardless of autogenerate
# revision_environment = false

# allow .pyc and .pyo files without a source .py file to be detected as revisions
# sourceless = false

# version location specification; defaults to alembic/versions
# version_locations = %(here)s/alembic/versions

# the output encoding used when revision files are written from script.py.mako
# output_encoding = utf-8

# separator used for `prepend_sys_path` and `version_locations` entries.
# `os` uses os.pathsep (colon on POSIX, semicolon on Windows).
path_separator = os

# prepend the alembic dir to sys.path so env.py can `import inv`
prepend_sys_path = .

# version path separator; valid values are colon, semicolon, space, newline
version_path_separator = os

# overridden in env.py via `Settings.db_path`
sqlalchemy.url = sqlite:///./_alembic_placeholder.db


[post_write_hooks]
# post_write_hooks defines scripts or Python functions that are run
# on newly generated revision scripts. Leave empty for now; ruff-format
# can be wired in later.
# hooks = ruff
# ruff.type = exec
# ruff.executable = ruff
# ruff.options = format REVISION_SCRIPT_FILENAME


# ----------------------------------------------------------------
# Logging configuration
# ----------------------------------------------------------------

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console
qualname =

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
