name: CI Matrix

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python-version: ["3.11", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install uv
        run: |
          python -m pip install --upgrade pip uv

      - name: Sync dependencies
        run: uv sync --frozen

      - name: Run pytest
        run: uv run pytest --tb=short

      - name: Run ruff lint
        run: uv run ruff check inv tests

      - name: Run mypy
        run: uv run mypy inv

  arm-test:
    # Native ARM64 runner (ubuntu-22.04-arm) mirrors the main matrix
    # exactly: actions/setup-python handles Python 3.11/3.12 without
    # needing apt deadsnakes or QEMU. The old uraimo/run-on-arch-action
    # path used `apt-get install python3.11` which fails on the Ubuntu
    # base image that action ships — hence the permanent red mark.
    runs-on: ubuntu-22.04-arm
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install uv
        run: |
          python -m pip install --upgrade pip uv

      - name: Sync dependencies
        run: uv sync --frozen

      - name: Run pytest
        run: uv run pytest --tb=short

      - name: Run ruff lint
        run: uv run ruff check inv tests

      - name: Run mypy
        run: uv run mypy inv
