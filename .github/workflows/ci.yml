name: CI Matrix

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python-version: ["3.11", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install uv
        run: |
          python -m pip install --upgrade pip uv

      - name: Sync dependencies
        run: uv sync --frozen

      - name: Run pytest
        run: uv run pytest --tb=short

      - name: Run ruff lint
        run: uv run ruff check inv tests

      - name: Run mypy
        run: uv run mypy inv

  arm-test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v2

      - name: Set up buildx
        uses: docker/setup-buildx-action@v2

      - name: Run tests on ARM64
        uses: uraimo/run-on-arch-action@v2
        with:
          arch: aarch64
          distro: ubuntu_latest
          
          run: |
            apt-get update && apt-get install -y python${{ matrix.python-version }} python3-pip git
            python${{ matrix.python-version }} -m pip install --upgrade pip uv
            uv sync --frozen
            uv run pytest --tb=short
            uv run ruff check inv tests
            uv run mypy inv
